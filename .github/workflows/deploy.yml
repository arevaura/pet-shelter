name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r python-app/requirements-dev.txt

      - name: Generate models from openapi.yaml
        run: python -m datamodel_code_generator --input openapi.yaml --output python-app/models.py

      - name: Lint
        run: ruff check python-app/

      - name: Test
        run: pytest python-app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./python-app/Dockerfile
          push: false
          load: true
          tags: python-pet-shelter:test

      - name: Smoke test Docker image
        run: |
          docker run --rm -d -p 8000:8000 --name python-test python-pet-shelter:test
          sleep 5
          curl -f http://localhost:8000/health
          docker stop python-test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./python-app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/python-pet-shelter:latest

  java-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn clean verify
        working-directory: java-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./java-app/Dockerfile
          push: false
          load: true
          tags: java-pet-shelter:test

      - name: Smoke test Docker image
        run: |
          docker run --rm -d -p 8080:8080 --name java-test java-pet-shelter:test
          sleep 10
          curl -f http://localhost:8080/health
          docker stop java-test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./java-app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/java-pet-shelter:latest